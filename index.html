<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-ar="🤖 مركز قيادة خالد للوكيل الذكي" data-en="🤖 Khalid's AI Agent Command Center">🤖 مركز قيادة خالد للوكيل الذكي</title>
    
    <!-- Common Styles -->
    <link rel="stylesheet" href="common/styles.css">
    <link rel="stylesheet" href="common/navigation.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: white;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.2);
        }
        .control-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; margin: 30px 0;
        }
        .control-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .control-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; border: none; padding: 12px 25px; border-radius: 10px;
            cursor: pointer; margin: 5px; font-size: 14px; transition: all 0.3s ease;
            font-weight: 600;
        }
        .btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status-display {
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;
            font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;
            margin: 10px 0;
        }
        .ai-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin: 20px 0;
        }
        .ai-card {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .ai-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }
        input, select, textarea {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 10px; border-radius: 8px; margin: 5px 0; width: 100%;
            font-size: 14px;
        }
        input::placeholder, textarea::placeholder { 
            color: rgba(255,255,255,0.6); 
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }
        h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        @media (max-width: 768px) {
            .control-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Language Toggle Button -->
    <button class="lang-toggle" id="lang-toggle-btn">
        <span>English</span>
    </button>
    
    <!-- Live Status Indicator -->
    <div class="live-status pulse" id="liveStatus">
        <span data-ar="🞵 الوكيل متصل مباشرة" data-en="🞵 Agent Connected Live">🞵 الوكيل متصل مباشرة</span>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 data-ar="🤖 مركز قيادة خالد للوكيل الذكي" data-en="🤖 Khalid's AI Agent Command Center">🤖 مركز قيادة خالد للوكيل الذكي</h1>
            <p>
                <span data-ar="onlainee.space | آخر تحديث:" data-en="onlainee.space | Last Update:">onlainee.space | آخر تحديث:</span>
                <span id="timestamp"></span>
            </p>
            <button class="btn" onclick="checkStatus()">
                <span data-ar="🔄 تحديث الحالة" data-en="🔄 Refresh Status">🔄 تحديث الحالة</span>
            </button>
        </div>
        
        <div class="control-grid">
            <!-- System Status -->
            <div class="control-card">
                <h3 data-ar="📊 حالة النظام" data-en="📊 System Status">📊 حالة النظام</h3>
                <div id="systemStatus" class="status-display">
                    <span data-ar="جاري التحميل..." data-en="Loading...">جاري التحميل...</span>
                </div>
                <button class="btn" onclick="getStatus()">
                    <span data-ar="🔍 فحص النظام" data-en="🔍 Check System">🔍 فحص النظام</span>
                </button>
                <button class="btn" onclick="monitorResources()">
                    <span data-ar="📊 مراقبة الموارد" data-en="📊 Monitor Resources">📊 مراقبة الموارد</span>
                </button>
            </div>
            
            <!-- AI Programs Control -->
            <div class="control-card">
                <h3 data-ar="🤖 تحكم برامج الـ AI" data-en="🤖 AI Programs Control">🤖 تحكم برامج الـ AI</h3>
                <div class="ai-grid">
                    <div class="ai-card">
                        <h4>ChatGPT</h4>
                        <button class="btn" onclick="startAI('chatgpt')">
                            <span data-ar="▶️ تشغيل" data-en="▶️ Start">▶️ تشغيل</span>
                        </button>
                        <button class="btn" onclick="stopAI('chatgpt')">
                            <span data-ar="⏹️ إيقاف" data-en="⏹️ Stop">⏹️ إيقاف</span>
                        </button>
                    </div>
                    <div class="ai-card">
                        <h4>Claude</h4>
                        <button class="btn" onclick="startAI('claude')">
                            <span data-ar="▶️ تشغيل" data-en="▶️ Start">▶️ تشغيل</span>
                        </button>
                        <button class="btn" onclick="stopAI('claude')">
                            <span data-ar="⏹️ إيقاف" data-en="⏹️ Stop">⏹️ إيقاف</span>
                        </button>
                    </div>
                    <div class="ai-card">
                        <h4>Gemini</h4>
                        <button class="btn" onclick="startAI('gemini')">
                            <span data-ar="▶️ تشغيل" data-en="▶️ Start">▶️ تشغيل</span>
                        </button>
                        <button class="btn" onclick="stopAI('gemini')">
                            <span data-ar="⏹️ إيقاف" data-en="⏹️ Stop">⏹️ إيقاف</span>
                        </button>
                    </div>
                </div>
                <button class="btn" onclick="stopAI('all')" style="width: 100%; margin-top: 10px;">
                    <span data-ar="🛑 إيقاف جميع برامج AI" data-en="🛑 Stop All AI Programs">🛑 إيقاف جميع برامج AI</span>
                </button>
            </div>
            
            <!-- Server Commands -->
            <div class="control-card">
                <h3 data-ar="⚡ أوامر السيرفر" data-en="⚡ Server Commands">⚡ أوامر السيرفر</h3>
                <input type="text" id="commandInput" 
                    data-ar-placeholder="اكتب أمر آمن (ls, ps, df, free)" 
                    data-en-placeholder="Enter safe command (ls, ps, df, free)"
                    placeholder="اكتب أمر آمن (ls, ps, df, free)">
                <button class="btn" onclick="executeCommand()" style="width: 100%;">
                    <span data-ar="⚡ تنفيذ" data-en="⚡ Execute">⚡ تنفيذ</span>
                </button>
                <div id="commandOutput" class="status-display"></div>
            </div>
            
            <!-- System Management -->
            <div class="control-card">
                <h3 data-ar="🔧 إدارة النظام" data-en="🔧 System Management">🔧 إدارة النظام</h3>
                <select id="serviceSelect">
                    <option value="nginx">Nginx</option>
                    <option value="mysql">MySQL</option>
                    <option value="php-fpm">PHP-FPM</option>
                    <option value="redis">Redis</option>
                </select>
                <button class="btn" onclick="restartService()" style="width: 100%;">
                    <span data-ar="🔄 إعادة تشغيل" data-en="🔄 Restart">🔄 إعادة تشغيل</span>
                </button>
                <button class="btn" onclick="updateSystem()" style="width: 100%;">
                    <span data-ar="⬆️ تحديث النظام" data-en="⬆️ Update System">⬆️ تحديث النظام</span>
                </button>
                <button class="btn" onclick="backupData()" style="width: 100%;">
                    <span data-ar="💾 نسخ احتياطي" data-en="💾 Backup Data">💾 نسخ احتياطي</span>
                </button>
            </div>
        </div>
        
        <div class="control-card">
            <h3 data-ar="📜 سجل الأوامر" data-en="📜 Command Log">📜 سجل الأوامر</h3>
            <div id="commandLog" class="status-display" style="max-height: 300px;"></div>
        </div>
    </div>
    
    <!-- Navigation Container -->
    <div id="nav-menu-container"></div>
    
    <!-- Common Scripts -->
    <script src="common/language.js"></script>
    <script src="common/navigation.js"></script>
    
    <script>
        const KHALID_TOKEN = 'KHALID_MASTER_2025_AGENT';
        const API_URL = '/command-center.php';
        
        // Language translations
        const translations = {
            ar: {
                'title': '🤖 مركز قيادة خالد للوكيل الذكي',
                'liveStatus': '🞵 الوكيل متصل مباشرة',
                'lastUpdate': 'آخر تحديث:',
                'refreshStatus': '🔄 تحديث الحالة',
                'systemStatus': '📊 حالة النظام',
                'loading': 'جاري التحميل...',
                'checkSystem': '🔍 فحص النظام',
                'monitorResources': '📊 مراقبة الموارد',
                'aiControl': '🤖 تحكم برامج الـ AI',
                'start': '▶️ تشغيل',
                'stop': '⏹️ إيقاف',
                'stopAll': '🛑 إيقاف جميع برامج AI',
                'serverCommands': '⚡ أوامر السيرفر',
                'commandPlaceholder': 'اكتب أمر آمن (ls, ps, df, free)',
                'execute': '⚡ تنفيذ',
                'systemManagement': '🔧 إدارة النظام',
                'restart': '🔄 إعادة تشغيل',
                'updateSystem': '⬆️ تحديث النظام',
                'backupData': '💾 نسخ احتياطي',
                'commandLog': '📜 سجل الأوامر',
                'domain': '🌐 Domain:',
                'uptime': '🔋 Uptime:',
                'processes': '💻 Processes:',
                'php': '🐍 PHP:',
                'status': '✅ Status:',
                'cpu': '📊 CPU:',
                'memory': '🧠 Memory:',
                'disk': '💾 Disk:',
                'updated': '🕰️ Updated:'
            },
            en: {
                'title': '🤖 Khalid\'s AI Agent Command Center',
                'liveStatus': '🞵 Agent Connected Live',
                'lastUpdate': 'Last Update:',
                'refreshStatus': '🔄 Refresh Status',
                'systemStatus': '📊 System Status',
                'loading': 'Loading...',
                'checkSystem': '🔍 Check System',
                'monitorResources': '📊 Monitor Resources',
                'aiControl': '🤖 AI Programs Control',
                'start': '▶️ Start',
                'stop': '⏹️ Stop',
                'stopAll': '🛑 Stop All AI Programs',
                'serverCommands': '⚡ Server Commands',
                'commandPlaceholder': 'Enter safe command (ls, ps, df, free)',
                'execute': '⚡ Execute',
                'systemManagement': '🔧 System Management',
                'restart': '🔄 Restart',
                'updateSystem': '⬆️ Update System',
                'backupData': '💾 Backup Data',
                'commandLog': '📜 Command Log',
                'domain': '🌐 Domain:',
                'uptime': '🔋 Uptime:',
                'processes': '💻 Processes:',
                'php': '🐍 PHP:',
                'status': '✅ Status:',
                'cpu': '📊 CPU:',
                'memory': '🧠 Memory:',
                'disk': '💾 Disk:',
                'updated': '🕰️ Updated:'
            }
        };
        
        // Listen to language changes
        window.addEventListener('languageChanged', function(event) {
            updateTimestamp();
        });
        
        function updateTimestamp() {
            const now = new Date();
            const currentLang = getCurrentLanguage();
            const locale = currentLang === 'ar' ? 'ar-SA' : 'en-US';
            document.getElementById('timestamp').textContent = now.toLocaleString(locale);
        }
        
        async function sendCommand(command, params = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Command-Token': KHALID_TOKEN
                    },
                    body: JSON.stringify({ command, params })
                });
                
                const result = await response.json();
                logCommand(command, result);
                return result;
            } catch (error) {
                console.error('Command failed:', error);
                logCommand(command, { status: 'error', message: error.message });
            }
        }
        
        function logCommand(command, result) {
            const log = document.getElementById('commandLog');
            const currentLang = getCurrentLanguage();
            const timestamp = new Date().toLocaleTimeString(currentLang === 'ar' ? 'ar-SA' : 'en-US');
            const status = result.status === 'success' ? '✅' : '❌';
            const message = result.message || result.error || 'Unknown';
            log.innerHTML = `[${timestamp}] ${status} ${command}: ${message}\n` + log.innerHTML;
        }
        
        async function getStatus() {
            const result = await sendCommand('status');
            const currentLang = getCurrentLanguage();
            if (result && result.server_info) {
                const t = translations[currentLang];
                document.getElementById('systemStatus').innerHTML = `
                    ${t.domain} ${result.server_info.domain}<br>
                    ${t.uptime} ${result.server_info.uptime}<br>
                    ${t.processes} ${result.server_info.active_processes}<br>
                    ${t.php} ${result.server_info.php_version}<br>
                    ${t.status} ${result.agent_status}
                `;
            } else {
                const t = translations[currentLang];
                document.getElementById('systemStatus').innerHTML = t.loading;
            }
        }
        
        async function startAI(aiName) {
            await sendCommand('start_ai', { ai: aiName });
        }
        
        async function stopAI(aiName) {
            await sendCommand('stop_ai', { ai: aiName });
        }
        
        async function executeCommand() {
            const cmd = document.getElementById('commandInput').value;
            if (cmd) {
                const result = await sendCommand('execute_command', { cmd });
                if (result && result.output) {
                    document.getElementById('commandOutput').textContent = result.output;
                }
                document.getElementById('commandInput').value = '';
            }
        }
        
        async function restartService() {
            const service = document.getElementById('serviceSelect').value;
            await sendCommand('restart_services', { service });
        }
        
        async function updateSystem() {
            await sendCommand('update_system');
        }
        
        async function backupData() {
            await sendCommand('backup_data');
        }
        
        async function monitorResources() {
            const result = await sendCommand('monitor_resources');
            const currentLang = getCurrentLanguage();
            if (result && result.resources) {
                const t = translations[currentLang];
                document.getElementById('systemStatus').innerHTML = `
                    ${t.cpu} ${result.resources.cpu_usage}<br>
                    ${t.memory} ${result.resources.memory_usage}<br>
                    ${t.disk} ${result.resources.disk_usage}<br>
                    ${t.updated} ${result.resources.timestamp}
                `;
            }
        }
        
        function checkStatus() {
            getStatus();
            monitorResources();
        }
        
        // Auto-update
        setInterval(() => {
            updateTimestamp();
            getStatus();
        }, 10000);
        
        // Initial load
        updateTimestamp();
        getStatus();
    </script>
</body>
</html>
