<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-ar="المراقبة والسجلات - AI Agent Platform" data-en="Monitoring & Logs - AI Agent Platform">المراقبة والسجلات - AI Agent Platform</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Common Styles -->
    <link rel="stylesheet" href="common/styles.css">
    <link rel="stylesheet" href="common/navigation.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        * {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header-card, .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .progress-custom {
            height: 12px;
            border-radius: 10px;
            background: #e2e8f0;
        }
        
        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .log-entry {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.6;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry.info { color: #3b82f6; }
        .log-entry.success { color: #10b981; }
        .log-entry.warning { color: #f59e0b; }
        .log-entry.error { color: #ef4444; }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .metric-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
        }
        
        .nav-tabs-custom .nav-link {
            border: none;
            color: #64748b;
            font-weight: 600;
            padding: 15px 25px;
            border-radius: 10px 10px 0 0;
            margin-left: 5px;
        }
        
        .nav-tabs-custom .nav-link.active {
            background: var(--primary-gradient);
            color: white;
        }
        
        .btn-custom {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Language Toggle Button -->
    <button class="lang-toggle" id="lang-toggle-btn">
        <span>English</span>
    </button>
    
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header-card">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-2">
                        <i class="bi bi-graph-up text-primary"></i>
                        <span data-ar="المراقبة والسجلات" data-en="Monitoring & Logs">المراقبة والسجلات</span>
                    </h1>
                    <p class="text-muted mb-0">
                        <span data-ar="مراقبة شاملة لأداء النظام والسجلات" data-en="Comprehensive monitoring of system performance and logs">مراقبة شاملة لأداء النظام والسجلات</span>
                    </p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-primary btn-custom" onclick="exportReport()">
                        <i class="bi bi-download"></i> <span data-ar="تصدير تقرير" data-en="Export Report">تصدير تقرير</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Tabs -->
        <ul class="nav nav-tabs nav-tabs-custom mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#resources" type="button">
                    <i class="bi bi-cpu"></i> <span data-ar="الموارد" data-en="Resources">الموارد</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#performance" type="button">
                    <i class="bi bi-speedometer2"></i> <span data-ar="الأداء" data-en="Performance">الأداء</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#logs" type="button" id="logs-tab">
                    <i class="bi bi-journal-text"></i> <span data-ar="السجلات" data-en="Logs">السجلات</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#reports" type="button">
                    <i class="bi bi-file-earmark-text"></i> <span data-ar="التقارير" data-en="Reports">التقارير</span>
                </button>
            </li>
        </ul>
        
        <div class="tab-content">
            <!-- Resources Tab -->
            <div class="tab-pane fade show active" id="resources" role="tabpanel">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="main-card">
                            <h3 class="mb-4">
                                <i class="bi bi-cpu text-warning"></i>
                                <span data-ar="استخدام الموارد" data-en="Resource Usage">استخدام الموارد</span>
                            </h3>
                            
                            <div class="metric-card">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="fw-bold"><span data-ar="المعالج (CPU)" data-en="CPU">المعالج (CPU)</span></span>
                                    <span id="cpuPercent" class="fw-bold">0%</span>
                                </div>
                                <div class="progress progress-custom">
                                    <div class="progress-bar bg-warning" id="cpuProgress" style="width: 0%"></div>
                                </div>
                                <small class="text-muted"><span data-ar="Cores: 4 | Load:" data-en="Cores: 4 | Load:">Cores: 4 | Load:</span> <span id="cpuLoad">0.00</span></small>
                            </div>
                            
                            <div class="metric-card">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="fw-bold"><span data-ar="الذاكرة (RAM)" data-en="Memory (RAM)">الذاكرة (RAM)</span></span>
                                    <span id="ramPercent" class="fw-bold">0%</span>
                                </div>
                                <div class="progress progress-custom">
                                    <div class="progress-bar bg-info" id="ramProgress" style="width: 0%"></div>
                                </div>
                                <small class="text-muted"><span data-ar="مستخدم:" data-en="Used:">مستخدم:</span> <span id="ramUsed">0</span> GB <span data-ar="من" data-en="of">من</span> <span id="ramTotal">16</span> GB</small>
                            </div>
                            
                            <div class="metric-card">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="fw-bold"><span data-ar="التخزين (Disk)" data-en="Storage (Disk)">التخزين (Disk)</span></span>
                                    <span id="diskPercent" class="fw-bold">0%</span>
                                </div>
                                <div class="progress progress-custom">
                                    <div class="progress-bar bg-success" id="diskProgress" style="width: 0%"></div>
                                </div>
                                <small class="text-muted"><span data-ar="مستخدم:" data-en="Used:">مستخدم:</span> <span id="diskUsed">0</span> GB <span data-ar="من" data-en="of">من</span> <span id="diskTotal">500</span> GB</small>
                            </div>
                            
                            <div class="metric-card">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="fw-bold"><span data-ar="الشبكة (Network)" data-en="Network">الشبكة (Network)</span></span>
                                    <span id="networkSpeed" class="fw-bold">0 KB/s</span>
                                </div>
                                <div class="progress progress-custom">
                                    <div class="progress-bar bg-primary" id="networkProgress" style="width: 0%"></div>
                                </div>
                                <small class="text-muted"><span data-ar="Upload:" data-en="Upload:">Upload:</span> <span id="networkUp">0</span> KB/s | <span data-ar="Download:" data-en="Download:">Download:</span> <span id="networkDown">0</span> KB/s</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <div class="main-card">
                            <h3 class="mb-4">
                                <i class="bi bi-activity text-danger"></i>
                                <span data-ar="نشاط النظام" data-en="System Activity">نشاط النظام</span>
                            </h3>
                            
                            <div class="chart-container">
                                <canvas id="activityChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Performance Tab -->
            <div class="tab-pane fade" id="performance" role="tabpanel">
                <div class="main-card">
                            <h3 class="mb-4">
                        <i class="bi bi-speedometer2 text-primary"></i>
                        <span data-ar="أداء النظام" data-en="System Performance">أداء النظام</span>
                    </h3>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <div class="chart-container">
                                <canvas id="performanceChart"></canvas>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <div class="chart-container">
                                <canvas id="requestsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Logs Tab -->
            <div class="tab-pane fade" id="logs" role="tabpanel">
                <div class="main-card">
                            <h3 class="mb-4">
                        <i class="bi bi-journal-text text-info"></i>
                        <span data-ar="سجلات النظام" data-en="System Logs">سجلات النظام</span>
                    </h3>
                    
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select class="form-select" id="logLevel">
                                <option value="all" data-ar="جميع المستويات" data-en="All Levels">جميع المستويات</option>
                                <option value="info" data-ar="معلومات" data-en="Info">معلومات</option>
                                <option value="success" data-ar="نجاح" data-en="Success">نجاح</option>
                                <option value="warning" data-ar="تحذير" data-en="Warning">تحذير</option>
                                <option value="error" data-ar="خطأ" data-en="Error">خطأ</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="logSearch" 
                                data-ar-placeholder="🔍 البحث في السجلات..." 
                                data-en-placeholder="🔍 Search in logs..."
                                placeholder="🔍 البحث في السجلات...">
                        </div>
                        <div class="col-md-3 text-end">
                            <button class="btn btn-danger btn-custom" onclick="clearLogs()">
                                <i class="bi bi-trash"></i> <span data-ar="مسح السجلات" data-en="Clear Logs">مسح السجلات</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="log-container" id="logsContainer">
                        <!-- Logs will be displayed here -->
                    </div>
                </div>
            </div>
            
            <!-- Reports Tab -->
            <div class="tab-pane fade" id="reports" role="tabpanel">
                <div class="main-card">
                            <h3 class="mb-4">
                        <i class="bi bi-file-earmark-text text-success"></i>
                        <span data-ar="التقارير" data-en="Reports">التقارير</span>
                    </h3>
                    
                    <div class="row" id="reportsList">
                        <!-- Reports will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Common Scripts -->
    <script src="common/language.js"></script>
    <script src="common/navigation.js"></script>
    
    <script>
        let activityChart, performanceChart, requestsChart;
        
        function initPage() {
            initCharts();
            loadResources();
            loadLogs();
            loadReports();
            
            setInterval(() => {
                loadResources();
                updateCharts();
            }, 3000);
            
            setInterval(() => {
                loadLogs();
            }, 5000);
        }
        
        function initCharts() {
            // Activity Chart
            const activityCtx = document.getElementById('activityChart').getContext('2d');
            activityChart = new Chart(activityCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: currentLang === 'ar' ? 'النشاط' : 'Activity',
                        data: [],
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
            
            // Performance Chart
            const perfCtx = document.getElementById('performanceChart').getContext('2d');
            performanceChart = new Chart(perfCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CPU %',
                            data: [],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Memory %',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
            
            // Requests Chart
            const reqCtx = document.getElementById('requestsChart').getContext('2d');
            requestsChart = new Chart(reqCtx, {
                type: 'bar',
                data: {
                    labels: ['GPT-4', 'Claude', 'LLaMA', 'Qwen', 'DeepSeek'],
                    datasets: [{
                        label: 'الطلبات',
                        data: [1250, 890, 2100, 450, 680],
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(139, 92, 246, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
        
        function loadResources() {
            const cpu = Math.floor(Math.random() * 20) + 45;
            const ram = Math.floor(Math.random() * 15) + 55;
            const disk = Math.floor(Math.random() * 10) + 60;
            const network = Math.floor(Math.random() * 50) + 20;
            
            document.getElementById('cpuUsage').textContent = cpu + '%';
            document.getElementById('cpuPercent').textContent = cpu + '%';
            document.getElementById('cpuProgress').style.width = cpu + '%';
            document.getElementById('cpuLoad').textContent = (cpu / 100 * 4).toFixed(2);
            
            document.getElementById('memoryUsage').textContent = ram + '%';
            document.getElementById('ramPercent').textContent = ram + '%';
            document.getElementById('ramProgress').style.width = ram + '%';
            document.getElementById('ramUsed').textContent = (ram * 0.16).toFixed(1);
            
            document.getElementById('diskPercent').textContent = disk + '%';
            document.getElementById('diskProgress').style.width = disk + '%';
            document.getElementById('diskUsed').textContent = (disk * 5).toFixed(0);
            
            document.getElementById('networkSpeed').textContent = network + ' KB/s';
            document.getElementById('networkProgress').style.width = Math.min(network, 100) + '%';
            document.getElementById('networkUp').textContent = Math.floor(network * 0.3);
            document.getElementById('networkDown').textContent = Math.floor(network * 0.7);
        }
        
        function updateCharts() {
            const now = new Date().toLocaleTimeString('ar-SA');
            const cpu = Math.floor(Math.random() * 20) + 45;
            const ram = Math.floor(Math.random() * 15) + 55;
            const activity = Math.floor(Math.random() * 100);
            
            // Update activity chart
            if (activityChart.data.labels.length > 20) {
                activityChart.data.labels.shift();
                activityChart.data.datasets[0].data.shift();
            }
            activityChart.data.labels.push(now);
            activityChart.data.datasets[0].data.push(activity);
            activityChart.update('none');
            
            // Update performance chart
            if (performanceChart.data.labels.length > 20) {
                performanceChart.data.labels.shift();
                performanceChart.data.datasets[0].data.shift();
                performanceChart.data.datasets[1].data.shift();
            }
            performanceChart.data.labels.push(now);
            performanceChart.data.datasets[0].data.push(cpu);
            performanceChart.data.datasets[1].data.push(ram);
            performanceChart.update('none');
        }
        
        function loadLogs() {
            const container = document.getElementById('logsContainer');
            const logLevel = document.getElementById('logLevel').value;
            const search = document.getElementById('logSearch').value.toLowerCase();
            
            const logs = [
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'info', message: 'تم تحديث حالة السيرفرات بنجاح' },
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'success', message: 'تم تشغيل نموذج GPT-4 بنجاح' },
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'warning', message: 'استخدام الذاكرة مرتفع: 85%' },
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'info', message: 'تم معالجة 125 طلب خلال الساعة الماضية' },
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'error', message: 'فشل الاتصال بالسيرفر الثانوي' },
                { time: new Date().toLocaleTimeString('ar-SA'), level: 'success', message: 'تم إنشاء نسخة احتياطية تلقائية' }
            ];
            
            const filtered = logs.filter(l => {
                const matchLevel = logLevel === 'all' || l.level === logLevel;
                const matchSearch = l.message.toLowerCase().includes(search);
                return matchLevel && matchSearch;
            });
            
            container.innerHTML = '';
            filtered.forEach(log => {
                const entry = `
                    <div class="log-entry ${log.level}">
                        [${log.time}] [${log.level.toUpperCase()}] ${log.message}
                    </div>
                `;
                container.innerHTML += entry;
            });
        }
        
        function loadReports() {
            const reports = [
                { title: 'تقرير الأداء اليومي', date: '2025-01-18', type: 'performance' },
                { title: 'تقرير الاستخدام الأسبوعي', date: '2025-01-17', type: 'usage' },
                { title: 'تقرير الأخطاء', date: '2025-01-16', type: 'errors' },
                { title: 'تقرير النسخ الاحتياطي', date: '2025-01-15', type: 'backup' }
            ];
            
            const container = document.getElementById('reportsList');
            container.innerHTML = '';
            
            reports.forEach(report => {
                const card = `
                    <div class="col-md-6 mb-3">
                        <div class="metric-card">
                            <h5>${report.title}</h5>
                            <p class="text-muted mb-2">${report.date}</p>
                            <button class="btn btn-sm btn-primary" onclick="viewReport('${report.title}')">
                                <i class="bi bi-eye"></i> عرض
                            </button>
                            <button class="btn btn-sm btn-outline-primary" onclick="downloadReport('${report.title}')">
                                <i class="bi bi-download"></i> تحميل
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }
        
        function clearLogs() {
            if (confirm('هل أنت متأكد من مسح جميع السجلات?')) {
                document.getElementById('logsContainer').innerHTML = '';
            }
        }
        
        function exportReport() {
            alert('تصدير التقرير - قيد التطوير');
        }
        
        function viewReport(title) {
            alert(`عرض التقرير: ${title} - قيد التطوير`);
        }
        
        function downloadReport(title) {
            alert(`تحميل التقرير: ${title} - قيد التطوير`);
        }
        
        // Listen to language changes
        window.addEventListener('languageChanged', function(event) {
            const currentLang = event.detail.language;
            
            // Update select options
            document.querySelectorAll('#logLevel option').forEach(opt => {
                if (opt.hasAttribute('data-ar') && opt.hasAttribute('data-en')) {
                    opt.textContent = currentLang === 'ar' ? opt.getAttribute('data-ar') : opt.getAttribute('data-en');
                }
            });
            
            // Update chart labels
            if (activityChart) {
                activityChart.data.datasets[0].label = currentLang === 'ar' ? 'النشاط' : 'Activity';
                activityChart.update();
            }
        });
        
        function clearLogs() {
            const currentLang = getCurrentLanguage();
            const msg = currentLang === 'ar' ? 'هل أنت متأكد من مسح جميع السجلات?' : 'Are you sure you want to clear all logs?';
            if (confirm(msg)) {
                document.getElementById('logsContainer').innerHTML = '';
            }
        }
        
        function exportReport() {
            const currentLang = getCurrentLanguage();
            const msg = currentLang === 'ar' ? 'تصدير التقرير - قيد التطوير' : 'Export Report - Under Development';
            alert(msg);
        }
        
        function viewReport(title) {
            const currentLang = getCurrentLanguage();
            const msg = currentLang === 'ar' ? `عرض التقرير: ${title} - قيد التطوير` : `View Report: ${title} - Under Development`;
            alert(msg);
        }
        
        function downloadReport(title) {
            const currentLang = getCurrentLanguage();
            const msg = currentLang === 'ar' ? `تحميل التقرير: ${title} - قيد التطوير` : `Download Report: ${title} - Under Development`;
            alert(msg);
        }
        
        document.getElementById('logLevel')?.addEventListener('change', loadLogs);
        document.getElementById('logSearch')?.addEventListener('input', loadLogs);
        
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
    
    <!-- Navigation Container -->
    <div id="nav-menu-container"></div>
</body>
</html>
