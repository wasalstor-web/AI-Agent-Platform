<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 مركز قيادة خالد للوكيل الذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: white;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.2);
        }
        .control-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; margin: 30px 0;
        }
        .control-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
        }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; border: none; padding: 12px 25px; border-radius: 10px;
            cursor: pointer; margin: 5px; font-size: 14px; transition: all 0.3s ease;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .status-display {
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;
            font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;
        }
        .ai-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin: 20px 0;
        }
        .ai-card {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .live-status {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
            padding: 10px 20px; border-radius: 25px; font-size: 14px;
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        input, select, textarea {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 10px; border-radius: 8px; margin: 5px 0; width: 100%;
        }
        input::placeholder { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="live-status pulse">
        🞵 الوكيل متصل مباشرة
    </div>
    
    <div class="container">
        <div class="header">
            <h1>🤖 مركز قيادة خالد للوكيل الذكي</h1>
            <p>onlainee.space | آخر تحديث: <span id="timestamp"></span></p>
            <button class="btn" onclick="checkStatus()">🔄 تحديث الحالة</button>
        </div>
        
        <div class="control-grid">
            <!-- System Status -->
            <div class="control-card">
                <h3>📊 حالة النظام</h3>
                <div id="systemStatus" class="status-display">جاري التحميل...</div>
                <button class="btn" onclick="getStatus()">🔍 فحص النظام</button>
                <button class="btn" onclick="monitorResources()">📊 مراقبة الموارد</button>
            </div>
            
            <!-- AI Programs Control -->
            <div class="control-card">
                <h3>🤖 تحكم برامج الـ AI</h3>
                <div class="ai-grid">
                    <div class="ai-card">
                        <h4>ChatGPT</h4>
                        <button class="btn" onclick="startAI('chatgpt')">▶️ تشغيل</button>
                        <button class="btn" onclick="stopAI('chatgpt')">⏹️ إيقاف</button>
                    </div>
                    <div class="ai-card">
                        <h4>Claude</h4>
                        <button class="btn" onclick="startAI('claude')">▶️ تشغيل</button>
                        <button class="btn" onclick="stopAI('claude')">⏹️ إيقاف</button>
                    </div>
                    <div class="ai-card">
                        <h4>Gemini</h4>
                        <button class="btn" onclick="startAI('gemini')">▶️ تشغيل</button>
                        <button class="btn" onclick="stopAI('gemini')">⏹️ إيقاف</button>
                    </div>
                </div>
                <button class="btn" onclick="stopAI('all')">🛑 إيقاف جميع برامج AI</button>
            </div>
            
            <!-- Server Commands -->
            <div class="control-card">
                <h3>⚡ أوامر السيرفر</h3>
                <input type="text" id="commandInput" placeholder="اكتب أمر آمن (ls, ps, df, free)">
                <button class="btn" onclick="executeCommand()">⚡ تنفيذ</button>
                <div id="commandOutput" class="status-display"></div>
            </div>
            
            <!-- System Management -->
            <div class="control-card">
                <h3>🔧 إدارة النظام</h3>
                <select id="serviceSelect">
                    <option value="nginx">Nginx</option>
                    <option value="mysql">MySQL</option>
                    <option value="php-fpm">PHP-FPM</option>
                    <option value="redis">Redis</option>
                </select>
                <button class="btn" onclick="restartService()">🔄 إعادة تشغيل</button>
                <button class="btn" onclick="updateSystem()">⬆️ تحديث النظام</button>
                <button class="btn" onclick="backupData()">💾 نسخ احتياطي</button>
            </div>
            
            <!-- Deployment Control -->
            <div class="control-card">
                <h3>🚀 نشر المشروع</h3>
                <button class="btn" onclick="publishAll()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); font-size: 16px; padding: 15px 30px;">
                    📦 نشر الكل / Publish All
                </button>
                <div id="publishStatus" class="status-display" style="margin-top: 15px; min-height: 100px;"></div>
            </div>
        </div>
        
        <div class="control-card">
            <h3>📜 سجل الأوامر</h3>
            <div id="commandLog" class="status-display" style="max-height: 300px;"></div>
        </div>
    </div>
    
    <script>
        const KHALID_TOKEN = 'KHALID_MASTER_2025_AGENT';
        const API_URL = '/command-center.php';
        
        function updateTimestamp() {
            document.getElementById('timestamp').textContent = new Date().toLocaleString('ar-SA');
        }
        
        async function sendCommand(command, params = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Command-Token': KHALID_TOKEN
                    },
                    body: JSON.stringify({ command, params })
                });
                
                const result = await response.json();
                logCommand(command, result);
                return result;
            } catch (error) {
                console.error('Command failed:', error);
                logCommand(command, { status: 'error', message: error.message });
            }
        }
        
        function logCommand(command, result) {
            const log = document.getElementById('commandLog');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const status = result.status === 'success' ? '✅' : '❌';
            log.innerHTML = `[${timestamp}] ${status} ${command}: ${result.message}\n` + log.innerHTML;
        }
        
        async function getStatus() {
            const result = await sendCommand('status');
            if (result && result.server_info) {
                document.getElementById('systemStatus').innerHTML = `
                    🌐 Domain: ${result.server_info.domain}\n
                    🔋 Uptime: ${result.server_info.uptime}\n
                    💻 Processes: ${result.server_info.active_processes}\n
                    🐍 PHP: ${result.server_info.php_version}\n
                    ✅ Status: ${result.agent_status}
                `;
            }
        }
        
        async function startAI(aiName) {
            await sendCommand('start_ai', { ai: aiName });
        }
        
        async function stopAI(aiName) {
            await sendCommand('stop_ai', { ai: aiName });
        }
        
        async function executeCommand() {
            const cmd = document.getElementById('commandInput').value;
            if (cmd) {
                const result = await sendCommand('execute_command', { cmd });
                if (result && result.output) {
                    document.getElementById('commandOutput').textContent = result.output;
                }
                document.getElementById('commandInput').value = '';
            }
        }
        
        async function restartService() {
            const service = document.getElementById('serviceSelect').value;
            await sendCommand('restart_services', { service });
        }
        
        async function updateSystem() {
            await sendCommand('update_system');
        }
        
        async function backupData() {
            await sendCommand('backup_data');
        }
        
        async function monitorResources() {
            const result = await sendCommand('monitor_resources');
            if (result && result.resources) {
                document.getElementById('systemStatus').innerHTML = `
                    📊 CPU: ${result.resources.cpu_usage}\n
                    🧠 Memory: ${result.resources.memory_usage}\n
                    💾 Disk: ${result.resources.disk_usage}\n
                    🕰️ Updated: ${result.resources.timestamp}
                `;
            }
        }
        
        async function publishAll() {
            // #region agent log
            fetch('http://127.0.0.1:7243/ingest/c21d1c2c-c721-49fe-8ebe-f011d322bca4', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    location: 'dashboard.html:publishAll:entry',
                    message: 'Publish all button clicked',
                    data: {action: 'button_click'},
                    timestamp: Date.now(),
                    sessionId: 'debug-session',
                    runId: 'run1',
                    hypothesisId: 'A'
                })
            }).catch(() => {});
            // #endregion
            
            const statusDiv = document.getElementById('publishStatus');
            statusDiv.innerHTML = '⏳ جاري النشر... يرجى الانتظار / Publishing... Please wait...';
            
            try {
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/c21d1c2c-c721-49fe-8ebe-f011d322bca4', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        location: 'dashboard.html:publishAll:before_send',
                        message: 'Before sending publish_all command',
                        data: {step: 'before_send'},
                        timestamp: Date.now(),
                        sessionId: 'debug-session',
                        runId: 'run1',
                        hypothesisId: 'B'
                    })
                }).catch(() => {});
                // #endregion
                
                const result = await sendCommand('publish_all');
                
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/c21d1c2c-c721-49fe-8ebe-f011d322bca4', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        location: 'dashboard.html:publishAll:after_receive',
                        message: 'Received publish_all response',
                        data: {status: result.status, total_steps: result.total_steps},
                        timestamp: Date.now(),
                        sessionId: 'debug-session',
                        runId: 'run1',
                        hypothesisId: 'C'
                    })
                }).catch(() => {});
                // #endregion
                
                if (result && result.deployment_steps) {
                    let statusHtml = `<strong>${result.message}</strong>\n\n`;
                    statusHtml += `الخطوات المنفذة / Steps Executed:\n`;
                    statusHtml += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
                    
                    result.deployment_steps.forEach(step => {
                        const icon = step.status === 'success' ? '✅' : step.status === 'skipped' ? '⏭️' : '⚠️';
                        statusHtml += `${icon} ${step.step}. ${step.name} (${step.status})\n`;
                        if (step.output && step.output.length > 0 && step.output !== 'Script not found' && step.output !== 'No changes to commit') {
                            statusHtml += `   ${step.output.substring(0, 100)}...\n`;
                        }
                        statusHtml += '\n';
                    });
                    
                    statusHtml += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
                    statusHtml += `إجمالي الخطوات / Total Steps: ${result.total_steps}\n`;
                    statusHtml += `الوقت / Time: ${result.timestamp}`;
                    
                    statusDiv.innerHTML = statusHtml.replace(/\n/g, '<br>');
                } else {
                    statusDiv.innerHTML = `❌ ${result.message || 'حدث خطأ أثناء النشر'}`;
                }
            } catch (error) {
                // #region agent log
                fetch('http://127.0.0.1:7243/ingest/c21d1c2c-c721-49fe-8ebe-f011d322bca4', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        location: 'dashboard.html:publishAll:error',
                        message: 'Error in publish_all',
                        data: {error: error.message},
                        timestamp: Date.now(),
                        sessionId: 'debug-session',
                        runId: 'run1',
                        hypothesisId: 'D'
                    })
                }).catch(() => {});
                // #endregion
                
                statusDiv.innerHTML = `❌ خطأ: ${error.message}`;
            }
        }
        
        // Auto-update
        setInterval(() => {
            updateTimestamp();
            getStatus();
        }, 10000);
        
        // Initial load
        updateTimestamp();
        getStatus();
    </script>
</body>
</html>
